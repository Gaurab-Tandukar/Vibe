<!doctype html>
<html>
  <head>
    <title>Vibe Socket Test</title>
  </head>
  <body>
    <h2>Socket.io Test Client</h2>
    <p>Open the browser console (F12) to see events.</p>

    <input id="tokenInput" placeholder="Paste JWT token" style="width: 400px" />
    <button onclick="connectSocket()">Connect</button>
    <br /><br />

    <input
      id="convoInput"
      placeholder="Paste conversation ID"
      style="width: 400px"
    />
    <button onclick="joinConvo()">Join Conversation</button>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      let socket;

      function connectSocket() {
        const token = document.getElementById("tokenInput").value;

        socket = io("http://localhost:3000", {
          auth: { token },
        });

        socket.on("connect", () => {
          console.log("✅ Connected:", socket.id);
        });

        socket.on("connect_error", (err) => {
          console.log("❌ Connection failed:", err.message);
        });

        socket.on("newMessage", (message) => {
          console.log("📩 New message:", message);
        });

        socket.on("newNotification", (notif) => {
          console.log("🔔 New notification:", notif);
        });

        socket.on("disconnect", () => {
          console.log("🔌 Disconnected");
        });
      }

      function joinConvo() {
        const convoId = document.getElementById("convoInput").value;
        if (!socket) {
          console.log("Connect first!");
          return;
        }
        socket.emit("joinConversation", convoId);
        console.log("Joined room:", convoId);
      }
    </script>
  </body>
</html>
